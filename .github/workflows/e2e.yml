name: E2E (nightly)

on:
  schedule:
    - cron: '0 18 * * *'   # 01:00 giờ Việt Nam
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dựng hạ tầng
        run: docker compose -f deploy/compose/infra.yml up -d --wait
      - name: Áp RabbitMQ topology
        run: ./scripts/apply-rabbitmq-topology.sh
      # E2E của giao diện (Playwright) nằm ở repo frontend — .github/workflows/ci.yml, job `e2e`. Nó
      # chạy với API giả + nhà phát hành OIDC giả nên không cần hạ tầng ở đây. Job này chỉ dựng hạ tầng
      # để kiểm nó lên được; test tải k6 chạy tay (load-tests/README.md), chưa nằm trong CI.
      - name: Hạ tầng đã lên
        run: docker compose -f deploy/compose/infra.yml ps
