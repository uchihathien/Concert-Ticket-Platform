name: Backend

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Lint (Spotless)
        run: sh ./mvnw -B -ntp spotless:check

      # Unit test + ArchUnit. ArchUnit là thứ chặn monorepo thoái hoá thành monolith,
      # nên nó chạy ở mọi PR chứ không phải nightly.
      - name: Unit test + ArchUnit
        run: sh ./mvnw -B -ntp verify -Pcoverage -DskipITs

      # Tách job để thấy ngay cái nào hỏng: logic hay hạ tầng.
      # Runner của GitHub có sẵn Docker nên Testcontainers chạy được.
      #
      # -Pcoverage ở CẢ HAI bước: bước unit ghi jacoco.exec, bước này ghi jacoco-it.exec, và JaCoCo gộp hai
      # tệp thành báo cáo target/site/jacoco-merged/ của từng module.
      - name: Integration test (Testcontainers) + coverage
        run: sh ./mvnw -B -ntp verify -Pcoverage -Dsurefire.skip=true

      # Cổng chặn tụt coverage, không phải mục tiêu: 85% dòng toàn repo (đo thực tế 87,7%). Nhánh chưa
      # đặt cổng vì mới 77% — xem docs/testing/known-testing-gaps.md.
      - name: Coverage summary + cổng 85% dòng
        working-directory: .
        run: |
          python3 scripts/coverage-summary.py --markdown --fail-under-line 85 | tee coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Lưu báo cáo JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-merged
          path: backend/**/target/site/jacoco-merged/
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
