# Đường từ một commit trên `main` tới hệ thống đang chạy.
#
# `backend.yml` chứng minh mã nguồn đúng; file này biến nó thành ảnh container và đánh dấu bản được
# đưa ra (tag `production`). Máy chủ tự kéo bản đó về — xem deploy/scripts/pull-deploy.sh.
# Hai việc tách làm hai workflow vì chúng hỏng vì những lý do khác nhau và cần chạy lại độc lập:
# test đỏ là lỗi mã nguồn, push ảnh hỏng thường là lỗi registry hoặc mạng.
#
# Frontend KHÔNG nằm ở đây. Nó là repo riêng, có `release.yml` của chính nó, và đẩy ảnh vào cùng
# một registry. Máy chủ chỉ kéo ảnh xuống, nên nó không cần mã nguồn frontend — điều này đã
# kiểm bằng `docker compose config` với một build context không tồn tại: compose chỉ đọc context
# khi thực sự build.
name: Release

on:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      frontend_tag:
        description: 'Tag ảnh frontend để deploy kèm (mặc định: main)'
        default: 'main'

concurrency:
  # KHÔNG cancel-in-progress: huỷ giữa chừng một lần deploy để lại cụm ở trạng thái nửa vời —
  # vài service đã đổi ảnh, vài service chưa. Xếp hàng chậm hơn nhưng luôn tới một trạng thái biết được.
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast=false: một service hỏng thì vẫn muốn biết 11 cái còn lại có build được không,
      # thay vì phải chạy lại toàn bộ để tìm ra cái thứ hai.
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - identity-service
          - catalog-service
          - inventory-service
          - ordering-service
          - payment-service
          - ledger-service
          - payout-service
          - ticketing-service
          - notification-service
          - analytics-service
          - realtime-gateway
          - ai-chatbox-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # Bối cảnh là GỐC repo, không phải `backend/` — Maven multi-module cần cả cây pom.
          # Đây là yêu cầu của chính Dockerfile, không phải lựa chọn ở đây.
          context: .
          file: backend/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:main
          # `scope` PHẢI tách theo service. Mặc định cả mười hai job dùng chung một scope, nên
          # chúng ghi đè cache của nhau và tỷ lệ trúng gần bằng không — CI chậm đi mà không có
          # dấu hiệu nào ngoài thời gian chạy.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Ảnh mới xuất xưởng luôn tối: chưa ai chạy thử. Kiểm ngay điều rẻ nhất mà cũng hay hỏng
      # nhất — jar có nằm đúng chỗ ENTRYPOINT trỏ tới không. Sai tên jar là lỗi chỉ lộ ra lúc
      # chạy, sau khi mọi thứ khác đã xanh.
      - name: Ảnh chạy được
        run: |
          docker run --rm --entrypoint sh \
            "ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}" \
            -c 'test -f /app/application.jar'

  # Duyệt = dời tag `production` tới commit vừa build. Máy chủ tự kéo về (deploy/scripts/pull-deploy.sh,
  # timer 2 phút) — workflow này KHÔNG chạm vào máy chủ.
  #
  # Trước đây job này SSH vào EC2. Trên tài khoản AWS này nó không chạy được lần nào: SCP của
  # Organization chặn OIDC nên runner không mở được cổng 22 cho chính nó, và Security Group chỉ mở 22
  # cho IP đã chạy aws-bootstrap.sh. Kéo thì không cần cổng nào mở vào, không cần khoá SSH hay
  # credential AWS nằm trên GitHub.
  promote:
    needs: images
    # workflow_dispatch chạy được trên mọi nhánh; chỉ commit của main mới được đưa ra người dùng thật.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Environment `production` là chỗ khai người duyệt. Không có nó thì mọi commit vào main đi
    # thẳng ra người dùng thật — với một hệ thống giữ tiền hộ người khác thì đó là quá nhanh.
    environment: production
    permissions:
      contents: write   # đẩy tag; không cần gì khác
    steps:
      - uses: actions/checkout@v4

      - name: Dời tag production tới commit này
        env:
          # Qua env chứ không nhúng `${{ }}` vào lệnh: giá trị do người bấm Run workflow gõ vào.
          FRONTEND_TAG: ${{ inputs.frontend_tag || 'main' }}
        run: |
          case "$FRONTEND_TAG" in
            *[!A-Za-z0-9_.-]*|'') echo "frontend_tag không hợp lệ: '$FRONTEND_TAG'" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tag có chú thích (-a): lời nhắn mang frontend_tag cho máy chủ đọc — một commit ở repo này
          # không có SHA tương ứng ở repo frontend, nên tag ảnh frontend phải đi kèm riêng.
          git tag -f -a production -m "Release ${GITHUB_SHA}" -m "frontend_tag=${FRONTEND_TAG}" "$GITHUB_SHA"
          git push -f origin refs/tags/production
          echo "production → ${GITHUB_SHA::7} (frontend $FRONTEND_TAG). Máy chủ kéo về trong ~2 phút." >> "$GITHUB_STEP_SUMMARY"
