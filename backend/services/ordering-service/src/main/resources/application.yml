spring:
  application:
    name: ordering-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ordering_db}
    username: ${DB_USER:ordering}
    password: ${DB_PASSWORD:ordering}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      pool-name: ordering-pool
  flyway:
    enabled: true
    locations: classpath:db/migration/platform,classpath:db/migration/ordering
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nexaticket}
    password: ${RABBITMQ_PASSWORD:nexaticket}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/nexaticket}

server:
  port: ${PORT:8093}
  shutdown: graceful

nexaticket:
  ordering:
    # Khach co bao lau de chuyen khoan. Cung la luoi an toan cuoi cung cua saga:
    # het han nay thi ghe duoc nha du moi co che bu tru khac da hong (sagas.md §2).
    payment-window: 15m
    # Han cho MOI loi goi noi bo. Ngan la co y: khach dang cho man hinh, va retry
    # trong luong dong bo se vuot ngan sach thoi gian cua ho.
    remote-timeout: 2s
    services:
      inventory-url: ${INVENTORY_URL:http://localhost:8092}
      catalog-url: ${CATALOG_URL:http://localhost:8091}
      payment-url: ${PAYMENT_URL:http://localhost:8095}
    workers:
      enabled: true
      expire-interval: 15s
      sweep-interval: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
