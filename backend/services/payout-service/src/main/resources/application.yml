spring:
  application:
    name: payout-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payout_db}
    username: ${DB_USER:payout}
    password: ${DB_PASSWORD:payout}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      pool-name: payout-pool
  flyway:
    enabled: true
    locations: classpath:db/migration/platform,classpath:db/migration/payout
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nexaticket}
    password: ${RABBITMQ_PASSWORD:nexaticket}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/nexaticket}

server:
  port: ${PORT:8096}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
