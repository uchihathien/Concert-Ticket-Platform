spring:
  application:
    name: realtime-gateway
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nexaticket}
    password: ${RABBITMQ_PASSWORD:nexaticket}
    listener:
      simple:
        # Message không đọc được thì VỨT, không giao lại.
        #
        # Mặc định là requeue, và với queue này nó thành một vòng lặp kín: message hỏng quay lại đầu
        # hàng đợi, lỗi lại, quay lại — suốt TTL 30 giây của nó. Một message sai định dạng đã sinh ra
        # 281.631 dòng lỗi ở môi trường dev và đốt CPU của cả instance.
        #
        # Vứt là đúng với chính triết lý của queue này (xem AvailabilityTopology): dữ liệu khả dụng
        # ghế cũ vô giá trị, client thấy version nhảy sẽ tự fetch lại. Không có DLX vì queue là tạm
        # và tự xoá theo instance.
        default-requeue-rejected: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/nexaticket}

server:
  port: ${PORT:8100}
  shutdown: graceful

# Gom 200ms moi suat dien thanh MOT message roi moi day xuong WebSocket.
# Khong gui mot message cho moi ghe (services.md §4).
nexaticket:
  realtime:
    coalesce-window: 200ms
    max-sessions-per-connection: 5

management:
  # Cổng quản trị riêng, KHÔNG publish ra ngoài.
  #
  # /actuator/prometheus lộ tên endpoint, số lượng request và độ trễ của từng đường — đủ để vẽ lại
  # bề mặt API và đoán được lúc nào hệ thống đang tải nặng. Trước đây nó nằm chung cổng ứng dụng và
  # được `anyRequest().authenticated()` bảo vệ, nên Prometheus không scrape nổi nếu không có JWT —
  # tức là hoặc không có metric, hoặc phải cấp token cho một scraper.
  #
  # Tách cổng giải quyết cả hai: bên trong cụm thì gọi thẳng 9090, còn ingress chỉ mở 8080.
  server:
    port: ${MANAGEMENT_PORT:9090}
  # Trace phân tán — TẮT mặc định.
  #
  # Bật bằng TRACING_ENABLED=true, và chỉ bật khi thật sự có collector nghe ở OTEL_ENDPOINT: không
  # có ai nhận thì exporter vẫn thử gửi mỗi vài giây và lấp đầy log bằng lỗi kết nối, che mất
  # những dòng đáng đọc.
  #
  # `probability` là tỷ lệ MẪU, không phải công tắc. 1.0 ở lưu lượng thật là rất nhiều dữ liệu và
  # rất nhiều tiền lưu trữ; 0.1 đủ để thấy hình dạng của độ trễ. Lỗi thì không cần lấy mẫu — chúng
  # đã có log kèm correlationId, và correlationId nay đi xuyên mọi service (CorrelationPropagation).
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%X{traceId:-}/%X{spanId:-}] %logger{36} - %msg%n"
