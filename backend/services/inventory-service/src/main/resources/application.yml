spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    hikari:
      # Mười một service dùng CHUNG một cụm PostgreSQL ở MVP (ADR-1002 — database riêng, cụm
      # chung). Với pool 30 thì tổng nhu cầu là 330 kết nối, còn cụm mặc định cho 100: hệ thống
      # KHÔNG BAO GIỜ chạy đủ được. Thực tế bốn service đã chiếm 99/100, toàn bộ nhàn rỗi, và
      # service thứ năm chết lúc khởi động với "remaining connection slots are reserved".
      #
      # 10 là con số hợp lý cho một service Spring: pool lớn không làm nhanh hơn, nó chỉ dịch chỗ
      # xếp hàng từ ứng dụng sang database. Service nào thật sự cần nhiều hơn thì nâng bằng
      # DB_POOL_SIZE, và đó là một quyết định có chủ đích chứ không phải mặc định.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: inventory-pool
  flyway:
    enabled: true
    locations: classpath:db/migration/platform,classpath:db/migration/inventory
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nexaticket}
    password: ${RABBITMQ_PASSWORD:nexaticket}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/nexaticket}

server:
  port: ${PORT:8092}
  shutdown: graceful
  # So do 3.000 ghe la ~400KB JSON. Nen xoa gan het chenh lech giua ten field dai
  # va ten field rut gon, nen giu ten dai cho de debug.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

nexaticket:
  inventory:
    hold-expiry:
      enabled: true
      interval: 10s

    demo:
      # Bán sẵn một phần chỗ của những suất diễn thuộc tổ chức mẫu, ngay lúc dựng tồn kho.
      #
      # BẬT mặc định vì một sơ đồ chỗ trống trơn không cho thấy màn hình chọn ghế làm được gì:
      # không có màu "đã bán", không có ghế lẻ, và câu hỏi thật sự khó — "còn hai ghế cạnh nhau
      # ở đâu?" — không có gì để trả lời.
      #
      # ĐẶT false Ở PRODUCTION.
      occupancy: ${INVENTORY_DEMO_OCCUPANCY:true}

      # Chốt chặn thứ hai, quan trọng hơn cả cờ trên: chỉ suất của ĐÚNG tổ chức này bị đụng tới.
      # Phải khớp nexaticket.catalog.demo-organization-id bên catalog-service; lệch nhau thì
      # không có gì được đánh dấu — hướng sai an toàn.
      organization-id: ${INVENTORY_DEMO_ORG_ID:00000000-0000-4000-a000-000000000001}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
