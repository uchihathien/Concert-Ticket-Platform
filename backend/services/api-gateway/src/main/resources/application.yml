spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/nexaticket}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # Rate limit: public theo IP, authenticated theo user (services.md §0)
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_RPS:50}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:100}
                key-resolver: "#{@principalOrIpKeyResolver}"
          routes:
            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8090}
              predicates:
                - Path=/v1/platform/organizations/**,/v1/organizations/**,/v1/me/**,/v1/invitations/**
            - id: inventory
              uri: ${INVENTORY_URL:http://localhost:8092}
              predicates:
                - Path=/v1/sessions/**,/v1/holds/**
            # THỨ TỰ QUAN TRỌNG: gateway khớp route theo thứ tự khai báo, và route đầu tiên
            # khớp là route thắng. /v1/orders/** của ordering bao trùm cả
            # /v1/orders/{id}/tickets, nên nếu ordering đứng trước thì mọi request lấy vé
            # theo đơn sẽ bị gửi nhầm sang ordering-service và trả 404.
            # Quy tắc: route hẹp hơn khai trước.
            - id: ticketing
              uri: ${TICKETING_URL:http://localhost:8097}
              predicates:
                - Path=/v1/me/tickets,/v1/orders/*/tickets,/v1/sessions/*/checkins
            - id: ordering
              uri: ${ORDERING_URL:http://localhost:8093}
              predicates:
                - Path=/v1/orders/**,/v1/me/orders
            # Các service khác thêm vào đây khi tới giai đoạn của chúng (G1+).
            # /internal/** CỐ Ý không có route: Open Host Service chỉ gọi được trong mạng nội bộ.
            # Riêng với inventory điều đó là bắt buộc: /internal/reservations đổi trạng thái
            # tồn kho mà không kiểm chủ sở hữu như đường công khai — để lọt ra internet là mất
            # kiểm soát ghế.

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
