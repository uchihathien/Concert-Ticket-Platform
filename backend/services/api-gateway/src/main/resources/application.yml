spring:
  main:
    # BẮT BUỘC khai tường minh là reactive.
    #
    # pom cha thêm spring-boot-starter-web cho mọi service; gateway hạ nó xuống scope provided để
    # "loại", nhưng spring-boot:run VẪN nạp dependency scope provided. Kết quả là cả hạ tầng web
    # servlet lẫn reactive cùng nằm trên classpath, Boot đoán kiểu ứng dụng là SERVLET, và Spring
    # Cloud Gateway — vốn chỉ chạy trên WebFlux — làm app chết ngay lúc khởi động:
    #
    #   The bean 'conversionServicePostProcessor' ... could not be registered
    #
    # Lỗi này nằm sẵn từ đầu và không ai thấy, vì gateway chưa từng được chạy thử: nó biên dịch
    # được, test được, chỉ không khởi động được.
    web-application-type: reactive
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/nexaticket}
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # Rate limit: public theo IP, authenticated theo user (services.md §0)
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_RPS:50}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:100}
                key-resolver: "#{@principalOrIpKeyResolver}"
          routes:
            # THỨ TỰ LÀ MỘT PHẦN CỦA CẤU HÌNH, KHÔNG PHẢI CHUYỆN THẨM MỸ.
            #
            # Gateway khớp theo thứ tự khai báo và route ĐẦU TIÊN khớp là route thắng. Nên quy tắc
            # duy nhất ở đây: mẫu HẸP hơn phải đứng trước mẫu RỘNG hơn bao trùm nó.
            #
            # Vi phạm quy tắc này không gây lỗi cấu hình nào — nó chỉ lặng lẽ gửi request sang sai
            # service. Đã xảy ra thật: identity giữ `/v1/me/**` và đứng trước ticketing, nên
            # `/v1/me/tickets` và `/v1/me/orders` đều rơi vào identity. Triệu chứng là 500 từ một
            # service không liên quan, và người ta đi soi ordering-service đang chạy hoàn toàn tốt.
            #
            # Bốn cặp chồng lấn hiện có, hẹp trước rộng sau:
            #   /v1/organizations/*/events/**  <  /v1/organizations/**   (catalog trước identity)
            #   /v1/me/tickets, /v1/me/orders  <  /v1/me/**              (ticketing, ordering trước identity)
            #   /v1/orders/*/tickets           <  /v1/orders/**          (ticketing trước ordering)
            #   /v1/sessions/*/checkins        <  /v1/sessions/**        (ticketing trước inventory)
            - id: catalog
              uri: ${CATALOG_URL:http://localhost:8091}
              predicates:
                - Path=/v1/events/**,/v1/organizations/*/venues/**,/v1/organizations/*/events/**
            - id: ticketing
              uri: ${TICKETING_URL:http://localhost:8097}
              predicates:
                - Path=/v1/me/tickets,/v1/orders/*/tickets,/v1/sessions/*/checkins
            - id: ordering
              uri: ${ORDERING_URL:http://localhost:8093}
              predicates:
                - Path=/v1/me/orders,/v1/orders/**
            - id: inventory
              uri: ${INVENTORY_URL:http://localhost:8092}
              predicates:
                - Path=/v1/sessions/**,/v1/holds/**
            # Rộng nhất, nên đứng cuối: `/v1/organizations/**` và `/v1/me/**` bao trùm mọi mẫu trên.
            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8090}
              predicates:
                - Path=/v1/platform/organizations/**,/v1/organizations/**,/v1/me,/v1/me/**,/v1/invitations/**
            # Các service khác thêm vào đây khi tới giai đoạn của chúng (G1+).
            # /internal/** CỐ Ý không có route: Open Host Service chỉ gọi được trong mạng nội bộ.
            # Riêng với inventory điều đó là bắt buộc: /internal/reservations đổi trạng thái tồn kho
            # mà không kiểm chủ sở hữu như đường công khai — để lọt ra internet là mất kiểm soát ghế.

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
