spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}
    hikari:
      # Mười một service dùng CHUNG một cụm PostgreSQL ở MVP (ADR-1002 — database riêng, cụm
      # chung). Với pool 30 thì tổng nhu cầu là 330 kết nối, còn cụm mặc định cho 100: hệ thống
      # KHÔNG BAO GIỜ chạy đủ được. Thực tế bốn service đã chiếm 99/100, toàn bộ nhàn rỗi, và
      # service thứ năm chết lúc khởi động với "remaining connection slots are reserved".
      #
      # 10 là con số hợp lý cho một service Spring: pool lớn không làm nhanh hơn, nó chỉ dịch chỗ
      # xếp hàng từ ứng dụng sang database. Service nào thật sự cần nhiều hơn thì nâng bằng
      # DB_POOL_SIZE, và đó là một quyết định có chủ đích chứ không phải mặc định.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: notification-pool
  flyway:
    enabled: true
    locations: classpath:db/migration/platform,classpath:db/migration/notification
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nexaticket}
    password: ${RABBITMQ_PASSWORD:nexaticket}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/nexaticket}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}

nexaticket:
  notification:
    from: ${MAIL_FROM:no-reply@nexaticket.vn}

    # Sự kiện mang userId chứ không mang email — dữ liệu cá nhân không nằm rải trong hàng đợi.
    # Địa chỉ nhận thư tra ở đây, đúng lúc sắp gửi.
    identity-url: ${IDENTITY_URL:http://localhost:8090}
    workers:
      enabled: true
      interval: 10s

server:
  port: ${PORT:8098}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # TẮT. Health indicator của mail mở một kết nối SMTP THẬT mỗi lần bị hỏi, và với SMTP không
      # phản hồi ngay thì nó chờ hết 5 giây timeout mặc định. Đo được: /actuator/health mất 5,014s.
      #
      # Hậu quả không dừng ở việc chậm. dev-up.sh chờ health với --max-time 3 nên luôn kết luận
      # notification-service "KHÔNG lên" dù nó đang chạy hoàn hảo. Ở production thì tệ hơn: liveness
      # probe của Kubernetes thường timeout 1-3 giây, và một service khoẻ mạnh sẽ bị giết đi giết
      # lại — cộng thêm một kết nối SMTP mở ra cho mỗi lần probe.
      #
      # SMTP hỏng vốn đã có tín hiệu đúng chỗ hơn: DispatchNotificationsJob đánh dấu thư FAILED
      # trong bảng notifications, và đó là thứ đáng báo động, không phải một cú bắt tay TCP.
      enabled: false

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
