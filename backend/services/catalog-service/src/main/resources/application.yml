spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
    hikari:
      # Mười một service dùng CHUNG một cụm PostgreSQL ở MVP (ADR-1002 — database riêng, cụm
      # chung). Với pool 30 thì tổng nhu cầu là 330 kết nối, còn cụm mặc định cho 100: hệ thống
      # KHÔNG BAO GIỜ chạy đủ được. Thực tế bốn service đã chiếm 99/100, toàn bộ nhàn rỗi, và
      # service thứ năm chết lúc khởi động với "remaining connection slots are reserved".
      #
      # 10 là con số hợp lý cho một service Spring: pool lớn không làm nhanh hơn, nó chỉ dịch chỗ
      # xếp hàng từ ứng dụng sang database. Service nào thật sự cần nhiều hơn thì nâng bằng
      # DB_POOL_SIZE, và đó là một quyết định có chủ đích chứ không phải mặc định.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: catalog-pool
  flyway:
    enabled: true
    locations: classpath:db/migration/platform,classpath:db/migration/catalog
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nexaticket}
    password: ${RABBITMQ_PASSWORD:nexaticket}
    publisher-confirm-type: correlated
    publisher-returns: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/nexaticket}

server:
  port: ${PORT:8091}
  shutdown: graceful
  compression:
    # Trang chi tiết trả cả suất diễn và hạng vé; JSON lặp tên field nên nén rất ăn.
    enabled: true
    mime-types: application/json

nexaticket:
  identity:
    # BẮT BUỘC, không phải tuỳ chọn.
    #
    # TenantFilter dựng TenantScope bằng cách hỏi identity-service xem người dùng thuộc tổ chức
    # nào. Thiếu khoá này thì bean MembershipLookup không được tạo (@ConditionalOnProperty), filter
    # rơi về bản luôn trả null, và MỌI endpoint quản trị đều hỏng với 401 — dù token hoàn toàn hợp
    # lệ. Triệu chứng trông y hệt lỗi cấu hình OIDC, nên rất tốn thời gian để lần ra.
    base-url: ${IDENTITY_URL:http://localhost:8090}

  outbox:
    publish-interval-ms: 500

  catalog:
    services:
      # Bảng điều khiển của ban tổ chức ghép dữ liệu của ba service. Hai địa chỉ này chỉ dùng cho
      # đường ĐỌC đó — không có lệnh ghi nào của catalog đi qua chúng.
      #
      # Hai service này chết thì bảng điều khiển vẫn mở, chỉ thiếu phần số và có `degraded` nói rõ
      # thiếu vì sao (OrganizationDashboardQuery). Nên sai địa chỉ ở đây KHÔNG làm hỏng gì rõ ràng
      # — nó chỉ làm mọi con số biến mất, lặng lẽ.
      inventory-url: ${INVENTORY_URL:http://localhost:8092}
      analytics-url: ${ANALYTICS_URL:http://localhost:8099}
      # Đây là màn hình quản trị chứ không phải khách đang giữ chỗ, nên ngân sách rộng hơn 2 giây
      # của saga checkout — nhưng vẫn hữu hạn, và vẫn nhỏ hơn kiên nhẫn của người đang nhìn màn hình.
      timeout: ${DASHBOARD_TIMEOUT:3s}

    # TRẦN CỨNG của nền tảng, không phải giá trị gợi ý. Ban tổ chức khai số nhỏ hơn thì được, khai
    # số lớn hơn thì bị kẹp xuống (PurchaseLimits.resolve). Đây là chốt chặn chống đầu cơ vé, nên
    # nới nó ra là quyết định của nền tảng chứ không phải của từng ban tổ chức.
    max-seated-per-hold: ${MAX_SEATED_PER_HOLD:8}
    max-standing-per-hold: ${MAX_STANDING_PER_HOLD:10}
    max-units-per-hold: ${MAX_UNITS_PER_HOLD:10}
    max-tickets-per-customer: ${MAX_TICKETS_PER_CUSTOMER:20}

    # Hoa hồng nền tảng, tính bằng điểm cơ bản: 500 = 5% (custodial-funds.md §N1).
    #
    # Ordering hỏi con số này lúc tạo đơn rồi CHỐT LUÔN vào đơn và vào từng dòng đơn. Đổi ở đây chỉ
    # ảnh hưởng đơn mới; đơn cũ giữ nguyên tỷ lệ lúc bán, vì hoá đơn sáu tháng trước vẫn phải in ra
    # đúng những gì khách đã thấy.
    #
    # ADR-1010: tổ chức KHÔNG được thấy con số này. Nó chỉ đi qua /internal, không qua gateway.
    commission-bps: ${PLATFORM_COMMISSION_BPS:500}

    # Dựng sẵn một tổ chức mẫu với vài sự kiện đã publish, lúc khởi động.
    #
    # BẬT mặc định vì một catalog rỗng làm cả hệ thống trông như hỏng: trang chủ trắng, không có
    # gì để bấm, không có suất nào để thử luồng mua vé. Bộ dựng là idempotent (UUID cố định,
    # ON CONFLICT DO NOTHING) nên khởi động lại nhiều lần không sinh thêm dữ liệu.
    #
    # ĐẶT false Ở PRODUCTION. Dữ liệu mẫu mang tổ chức và sự kiện không có thật.
    demo-data: ${CATALOG_DEMO_DATA:true}

    # Tổ chức đứng tên dữ liệu mẫu.
    #
    # Mặc định là một UUID không có thật, nên sự kiện mẫu hiện ở trang khách nhưng KHÔNG hiện
    # trong khu vực quản trị — không ai là thành viên của tổ chức đó. Muốn vừa có dữ liệu ở trang
    # khách vừa có dữ liệu để bấm thử trong app tổ chức thì đặt biến này bằng id tổ chức thật của
    # bạn (lấy ở GET /v1/me/organizations).
    demo-organization-id: ${CATALOG_DEMO_ORG_ID:00000000-0000-4000-a000-000000000001}

management:
  # Cổng quản trị riêng, KHÔNG publish ra ngoài.
  #
  # /actuator/prometheus lộ tên endpoint, số lượng request và độ trễ của từng đường — đủ để vẽ lại
  # bề mặt API và đoán được lúc nào hệ thống đang tải nặng. Trước đây nó nằm chung cổng ứng dụng và
  # được `anyRequest().authenticated()` bảo vệ, nên Prometheus không scrape nổi nếu không có JWT —
  # tức là hoặc không có metric, hoặc phải cấp token cho một scraper.
  #
  # Tách cổng giải quyết cả hai: bên trong cụm thì gọi thẳng 9090, còn ingress chỉ mở 8080.
  server:
    port: ${MANAGEMENT_PORT:9090}
  # Trace phân tán — TẮT mặc định.
  #
  # Bật bằng TRACING_ENABLED=true, và chỉ bật khi thật sự có collector nghe ở OTEL_ENDPOINT: không
  # có ai nhận thì exporter vẫn thử gửi mỗi vài giây và lấp đầy log bằng lỗi kết nối, che mất
  # những dòng đáng đọc.
  #
  # `probability` là tỷ lệ MẪU, không phải công tắc. 1.0 ở lưu lượng thật là rất nhiều dữ liệu và
  # rất nhiều tiền lưu trữ; 0.1 đủ để thấy hình dạng của độ trễ. Lỗi thì không cần lấy mẫu — chúng
  # đã có log kèm correlationId, và correlationId nay đi xuyên mọi service (CorrelationPropagation).
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%X{traceId:-}/%X{spanId:-}] %logger{36} - %msg%n"
  level:
    com.nexaticket: ${LOG_LEVEL:INFO}
