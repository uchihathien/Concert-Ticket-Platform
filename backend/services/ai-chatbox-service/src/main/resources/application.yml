spring:
  application:
    name: ai-chatbox-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_chatbox_db}
    username: ${DB_USER:ai_chatbox}
    password: ${DB_PASSWORD:ai_chatbox}
    hikari:
      # 10 như mọi service khác: mười ba service dùng chung một cụm PostgreSQL cho 100 kết nối
      # (ADR-1002). Xem ghi chú dài ở analytics-service.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: ai-chatbox-pool
  flyway:
    enabled: true
    locations: classpath:db/migration/platform,classpath:db/migration/aichatbox
    # BẮT BUỘC kể từ khi service này nhận thêm starter-idempotency.
    #
    # Starter mang theo migration platform V0002, một số hiệu THẤP HƠN V0100/V0101 mà database
    # hiện có đã chạy. Với mặc định `out-of-order=false`, Flyway coi đó là lỗi nghiêm trọng
    # ("Detected resolved migration not applied to database: 0002") và service TỪ CHỐI KHỞI ĐỘNG —
    # trên database đang chạy thật, không phải trên máy sạch, nên CI xanh mà production đỏ.
    #
    # Bật cờ này cho phép chèn một migration số thấp vào sau. Nó nới lỏng một phép kiểm, và đánh
    # đổi ấy chấp nhận được vì mỗi service ở đây sở hữu trọn database của mình: không có ai khác
    # chen migration vào giữa.
    out-of-order: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8081/realms/nexaticket}

server:
  port: ${PORT:8101}
  shutdown: graceful

nexaticket:
  aichatbox:
    # local | anthropic — xem LlmProvider.
    #
    # Mặc định LOCAL, và đó là một lựa chọn chứ không phải giá trị tạm: chat hỗ trợ chạy suốt ngày
    # với lưu lượng không đoán trước, và mỗi lượt tính tiền hai lần (nhúng + mô hình) nhân với số
    # vòng ReAct. Một mặc định có tính tiền nghĩa là mọi môi trường dev và mọi lần chạy thử đều ghi
    # vào hoá đơn thật.
    #
    # Đổi sang `anthropic` ở nơi cần chất lượng cao hơn — mô hình 7B gọi tool kém tin cậy hơn hẳn,
    # và hậu quả là tỷ lệ chuyển sang bàn hỗ trợ cao hơn.
    provider: ${AI_PROVIDER:local}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      # Phải hỗ trợ tool calling VÀ viết được tiếng Việt. Phần lớn mô hình nhỏ thiếu cái đầu, và
      # agent này sống bằng tool.
      chat-model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b-instruct}
      # bge-m3 sinh vector 1024 chiều — ĐÚNG BẰNG vector(1024) mà V0100 khai cho voyage-3.5. Sự
      # trùng khớp ấy là lý do chọn nó: đổi nhà cung cấp mà không phải sửa schema. Đổi sang mô hình
      # số chiều khác thì phải đổi cột VÀ nhúng lại toàn bộ kho tri thức.
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
      dimensions: ${OLLAMA_EMBEDDING_DIMENSIONS:1024}
      # Rộng hơn hẳn hạn của API trả phí: mô hình local chạy CPU thì một lượt 30–60 giây là bình
      # thường, và cắt ở 60s sẽ biến máy chậm thành "trợ lý luôn hỏng".
      timeout: ${OLLAMA_TIMEOUT:120s}
      # Hạn RIÊNG cho nhúng. 60s vì lời gọi đầu tiên mất ~21 giây (Ollama nạp mô hình vào bộ nhớ);
      # những lời gọi sau ~130ms. Con số 30s trước đây đã làm việc nạp tri thức nền chết ở lần khởi
      # động đầu tiên sau khi pull mô hình. Không dùng chung 120s của chat: hai phút chờ chỉ để biết
      # Ollama không chạy là quá lâu cho người đang soạn kho tri thức.
      embedding-timeout: ${OLLAMA_EMBEDDING_TIMEOUT:60s}
    agent:
      # Mô hình mặc định. Đổi model là đổi cả hành vi lẫn giá — nên nó nằm ở cấu hình, không nằm
      # trong mã nguồn.
      model: ${AGENT_MODEL:claude-opus-5}
      # Trần số vòng ReAct. Chốt chặn chi phí: mỗi vòng là một lần gọi API có tính tiền.
      max-tool-iterations: ${AGENT_MAX_TOOL_ITERATIONS:4}
      history-turns: ${AGENT_HISTORY_TURNS:10}
      retrieval-top-k: ${AGENT_RETRIEVAL_TOP_K:5}
      # Trần đồng thời của MỘT instance. Đặt theo năng lực nhà cung cấp mô hình, KHÔNG theo số
      # luồng của Tomcat: một container Ollama chỉ suy luận song song được vài luồng, và nhận
      # nhiều hơn chỉ làm mọi người cùng chờ lâu hơn. Với AI_PROVIDER=anthropic thì nới rộng được.
      max-concurrent-turns: ${AGENT_MAX_CONCURRENT_TURNS:16}
      # Hàng đợi hữu hạn là chốt chặn nhận tải. Đầy thì trả 503 ngay — tử tế hơn hẳn việc cho xếp
      # hàng rồi hết hạn sau hai phút, và không giữ kết nối nào trong lúc chờ.
      max-queued-turns: ${AGENT_MAX_QUEUED_TURNS:32}
      # Một người chỉ hợp lý khi có một câu hỏi đang chạy; 2 là chỗ cho một lần bấm lại. Đây là
      # thứ mà giới hạn tần suất ở gateway KHÔNG thấy: 200 request chậm vẫn nằm trong 50 rps.
      max-concurrent-turns-per-user: ${AGENT_MAX_TURNS_PER_USER:2}
      # Ngưỡng khoảng cách cosine. pgvector luôn trả đủ top-k kể cả khi không có gì liên quan;
      # không cắt thì đoạn lạc đề đi thẳng vào prompt.
      max-retrieval-distance: ${AGENT_MAX_RETRIEVAL_DISTANCE:0.55}
    anthropic:
      # KHÔNG có mặc định, và service từ chối khởi động nếu thiếu — nhưng CHỈ khi provider =
      # anthropic. Với provider mặc định (local) thì cả khối này không được dựng, nên máy chưa có
      # khoá trả phí vẫn chạy được service.
      api-key: ${ANTHROPIC_API_KEY:}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:8000}
      # low | medium | high | xhigh | max. Chat hỗ trợ thường đủ ở mức thấp; mỗi nấc cao hơn là
      # thêm token suy luận phải trả tiền cho từng câu hỏi.
      effort: ${ANTHROPIC_EFFORT:medium}
      # Mặc định của SDK là 10 phút — quá dài cho người đang nhìn màn hình chat, và đủ để một sự
      # cố phía nhà cung cấp chiếm hết luồng của Tomcat.
      timeout: ${ANTHROPIC_TIMEOUT:60s}
    embedding:
      # Claude không có endpoint nhúng. Voyage là nhà cung cấp Anthropic khuyến nghị đi kèm.
      api-key: ${VOYAGE_API_KEY:}
      model: ${EMBEDDING_MODEL:voyage-3.5}
      # PHẢI khớp vector(n) trong V0100. Đổi mô hình ⇒ đổi cột ⇒ nhúng lại toàn bộ kho tri thức.
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
      timeout: ${EMBEDDING_TIMEOUT:10s}
    starter-knowledge:
      # Nạp tri thức nền khi kho còn TRỐNG — xem KnowledgeSeeder.
      #
      # Bật mặc định ở MỌI môi trường, kể cả production, và tên khoá cố ý không phải `demo-data`:
      # nội dung ấy mô tả hành vi thật của hệ thống (giữ chỗ 10 phút, hạn thanh toán 15 phút, nhận
      # vé ở ví vé), không phải dữ liệu giả. Kho rỗng ở production nghĩa là trợ lý chỉ tra được đơn
      # hàng và trả lời "mình chưa tra được" cho mọi câu hỏi chính sách.
      #
      # Đội vận hành sửa hoặc xoá đoạn nào cũng được: điều kiện nạp là kho trống, nên lần khởi động
      # sau không dựng lại những gì họ vừa bỏ đi.
      enabled: ${STARTER_KNOWLEDGE_ENABLED:true}
    handoff:
      # Chat không có kết nối thường trực nên không có sự kiện "khách đã rời đi". Phiếu của người
      # đã đóng tab chỉ dọn được bằng một job theo lịch — xem AbandonedHandoffReaper.
      #
      # 24 giờ, không phải 30 phút: bàn hỗ trợ làm theo giờ hành chính, và một phiếu mở lúc 22h
      # đêm phải sống qua đêm để ca sáng còn thấy.
      abandoned-after: ${HANDOFF_ABANDONED_AFTER:24h}
      reaper:
        enabled: ${HANDOFF_REAPER_ENABLED:true}
        interval: ${HANDOFF_REAPER_INTERVAL:1h}
    services:
      ordering-url: ${ORDERING_URL:http://localhost:8093}
      # Ngắn hơn hạn của mô hình: lời gọi này nằm bên trong một lượt chat mà khách đang chờ.
      timeout: ${AICHATBOX_REMOTE_TIMEOUT:3s}

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_SAMPLE_RATE:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
