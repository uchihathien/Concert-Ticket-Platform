# Nginx reverse proxy cho NexaTicket. Chép vào /etc/nginx/sites-available/nexaticket.
#
#   sudo cp deploy/nginx/nexaticket.conf /etc/nginx/sites-available/nexaticket
#   sudo ln -sf /etc/nginx/sites-available/nexaticket /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Dùng BẢN NÀY TRƯỚC (chỉ HTTP), rồi mới chạy certbot — certbot sẽ tự thêm khối TLS và chuyển
# hướng 80→443 vào chính file này. Tự viết sẵn khối 443 trước khi có cert sẽ làm `nginx -t` đỏ vì
# trỏ tới file cert chưa tồn tại, và khi đó certbot cũng không chạy được.
#
# BẢY tên miền. Mọi upstream đều là 127.0.0.1 vì prod.yml bind cổng vào loopback: internet không
# chạm được vào chúng kể cả khi Security Group bị khai sai.

# WebSocket cần hai header này đi qua. Để sẵn cho realtime-gateway khi UI nối tới nó.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Tất cả vhost dùng chung khối proxy này.
# X-Forwarded-Proto là BẮT BUỘC, không phải tuỳ chọn: thiếu nó Keycloak dựng redirect URI bằng
# http:// nội bộ và vòng đăng nhập gãy ở bước quay về, với thông báo lỗi không nói rõ lý do.
# Nó cũng là thứ gateway dùng để đếm proxy (TRUSTED_PROXY_COUNT=1) cho rate limit.

# --- web-customer (trang khách) ---
server {
    listen 80;
    server_name concertth.site;

    # Ảnh bìa sự kiện đi qua đường này khi tải lên; mặc định 1m của Nginx sẽ chặn.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

