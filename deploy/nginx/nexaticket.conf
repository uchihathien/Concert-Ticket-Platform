# --- api-gateway: cửa DUY NHẤT từ internet vào backend ---
server {
    listen 80;
    server_name api.concertth.site;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Trợ lý AI: một lượt chat có thể tới 120s (hạn khai trong ai-chatbox-service). Mặc định
        # 60s của Nginx sẽ cắt giữa câu trả lời, và lỗi hiện ra là 504 — trông như backend chết.
        proxy_read_timeout 300s;
    }
}

# --- Keycloak ---
server {
    listen 80;
    server_name tai-khoan.concertth.site;

    # Trang đăng nhập Keycloak không nhận upload; giữ mức thấp.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Keycloak chạy với KC_PROXY_HEADERS=xforwarded và tin BỐN header này để dựng redirect URI.
        # Thiếu X-Forwarded-Proto là vòng đăng nhập gãy ở bước quay về.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }
}

# --- Kho ảnh (SeaweedFS, giao thức S3) ---
#
# Trình duyệt tải ảnh bìa LÊN THẲNG đây bằng presigned URL do catalog-service ký. Chữ ký bao gồm
# cả tên host, nên tên miền này PHẢI khớp MEDIA_PUBLIC_URL — lệch một ký tự là lỗi chữ ký không khớp.
server {
    listen 80;
    server_name media.concertth.site;

    # Ảnh bìa sự kiện. Nới rộng hơn các vhost khác vì đây là đường đi của chính file.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        # Ảnh bìa KHÔNG đổi theo URL: tên vật thể là UUID do kho sinh, hoặc slug cố định của sự kiện.
        # SeaweedFS chỉ trả ETag và KHÔNG trả Cache-Control, nên trình duyệt hỏi lại gần như mỗi lần
        # — đo trên production: trang danh sách 32 poster là 4,8 MB, tải lại nguyên vẹn mỗi lượt xem.
        # 30 ngày là an toàn vì đổi ảnh bìa nghĩa là vật thể MỚI với tên mới; URL cũ không bao giờ trỏ
        # sang nội dung khác.
        add_header Cache-Control "public, max-age=2592000" always;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # KHÔNG đệm body khi tải lên: file 50m nằm trong RAM/đĩa tạm của Nginx trước khi đi tiếp
        # là vừa chậm vừa tốn, trong khi SeaweedFS nhận stream được.
        proxy_request_buffering off;
    }
}
