# Nén JSON (và mọi thứ dạng chữ) ở mức http — file riêng trong conf.d, KHÔNG sửa nexaticket.conf.
#
# VÌ SAO FILE RIÊNG: certbot ghi thẳng khối TLS vào /etc/nginx/sites-enabled/nexaticket. Chép lại
# nexaticket.conf từ repo sau lần dựng đầu là xoá sạch chứng chỉ — 7 tên miền chết cùng lúc, và lỗi
# trông như "SSL handshake failed" chứ không như "ai đó vừa chép đè một file". conf.d/*.conf được
# nginx.conf của Ubuntu include sẵn ở mức http, certbot không đụng tới, chép đè bao nhiêu lần cũng được.
#
# VÌ SAO CẦN: nginx.conf mặc định của Ubuntu có `gzip on` nhưng gzip_types chỉ có text/html.
# GET /v1/sessions/{id}/seats của một sân 16.796 ghế là 5,3 MB JSON đi nguyên, ~5 giây trên đường
# nhanh và vài chục giây trên điện thoại — trang chọn ghế trông như treo, rồi client bỏ cuộc. Cùng
# JSON đó nén gzip còn khoảng 5–8%. SDK được viết cho suất 3.000 ghế (~400 KB); sân lớn thì nén là
# tối thiểu, và tải theo khu là bước sau.
# KHÔNG khai lại `gzip on;`: nginx.conf của Ubuntu đã có ở dòng 46, và nginx TỪ CHỐI directive
# trùng trong cùng ngữ cảnh — `nginx -t` báo `"gzip" directive is duplicate` rồi `systemctl reload`
# thất bại. Nginx cũ vẫn chạy nên web không chết ngay; lần reboot kế mới là lúc nó không bật lên.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/problem+json application/javascript text/css text/plain
           application/xml image/svg+xml;
