# Biến thể xanh chanh của theme NexaTicket — cùng tông với app mobile và web Tổ chức.
#
# Kế thừa toàn bộ `nexaticket` (template, CSS, logo, font, tiếng Việt). Chỉ thêm một file CSS
# ghi đè khối biến --nt-*; không có template hay bản dịch riêng.
#
# Gán cho từng client bằng thuộc tính `login_theme` (mobile-customer, mobile-staff, web-admin) —
# xem deploy/scripts/keycloak-set-theme.sh.
parent=nexaticket
import=common/keycloak
styles=css/login.css css/nexaticket.css css/nexaticket-lime.css
locales=vi,en
