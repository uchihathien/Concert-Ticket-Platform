# Theme đăng nhập NexaTicket — cùng màu (xanh lá + xanh chanh, customer-theme.css), font và kiểu nút với web-customer.
#
# Kế thừa theme `keycloak` (PatternFly 4) có sẵn trong image, chỉ ghi đè:
#   - template.ftl: bố cục thẻ form + logo + cột giới thiệu, bỏ header "Keycloak" mặc định
#   - css/nexaticket.css: toàn bộ màu/bo góc/nút qua biến --nt-* (cùng tên với tokens.css)
#   - messages/messages_vi.properties: Keycloak 26.0 không có sẵn bản tiếng Việt
#
# Các trang còn lại (login.ftl, register.ftl, login-reset-password.ftl, …) dùng nguyên template
# của Keycloak: nâng cấp Keycloak thì form vẫn đúng, ta chỉ đổi cái vỏ bên ngoài.
parent=keycloak
import=common/keycloak

# `styles` của theme con THAY THẾ của theme cha, nên phải kể lại login.css của `keycloak`.
# Keycloak tìm file theo chuỗi kế thừa, nên `css/login.css` vẫn lấy đúng bản của theme cha.
styles=css/login.css css/nexaticket.css

# Ngôn ngữ theme hỗ trợ. Realm phải bật đa ngôn ngữ và khai `vi` thì mới dùng được.
locales=vi,en
