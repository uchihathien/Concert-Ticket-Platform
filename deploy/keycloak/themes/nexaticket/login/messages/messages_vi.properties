# Tiếng Việt cho trang đăng nhập NexaTicket.
#
# Keycloak 26.0 không có sẵn bản tiếng Việt, nên file này dịch mọi câu của những trang người dùng
# thật sự gặp: đăng nhập, đăng ký, quên/đặt lại mật khẩu, xác minh email, OTP, thông báo, lỗi,
# xác nhận đăng xuất. Khoá nào không có ở đây thì Keycloak rơi về tiếng Anh.
#
# Giọng văn: cùng kiểu với màn đăng nhập nhân viên của app mobile — nói rõ chuyện gì xảy ra và
# việc cần làm tiếp, không đổ lỗi cho người dùng.
#
# Lưu ý MessageFormat: dấu nháy đơn phải viết thành hai dấu ('').

