# Compose cho môi trường thật — chạy CẢ ứng dụng, không chỉ hạ tầng như `infra.yml`.
#
#   cp prod.env.example .env      # rồi điền secret thật, KHÔNG commit .env
#   docker compose -f deploy/compose/prod.yml --env-file deploy/compose/.env up -d --wait
#
# BA NGUYÊN TẮC ĐỌC ĐƯỢC TỪ FILE NÀY
#
# 1. Không giá trị nhạy cảm nào có mặc định. `${X:?...}` làm compose từ chối chạy khi thiếu, kèm
#    tên biến. Mặc định "cho tiện" là cách một mật khẩu dev đi lên production mà không ai thấy.
#
# 2. Chỉ gateway và bốn app Next mở cổng ra host. Mười hai service backend KHÔNG publish gì —
#    kể cả cổng quản trị 9090. Đó chính là thứ làm cho `/actuator/prometheus` không cần token mà
#    vẫn không lộ ra internet.
#
# 3. HAI tag ảnh, không phải một. Backend và frontend là hai repo, nên một commit ở bên này không
#    có SHA tương ứng ở bên kia. Dùng chung một `${TAG}` nghĩa là mỗi lần deploy backend lại kéo
#    theo một tag frontend không tồn tại — và compose báo `manifest unknown`, một thông báo không
#    hề nói ra rằng nguyên nhân là bố cục repo.
#
# 4. Mỗi service một user database riêng (ADR-1002). Dùng chung một user thì test cô lập đỏ, và
#    một lỗ hổng ở service nhỏ nhất đọc được sổ cái.
name: nexaticket-prod

# --- Mảnh dùng lại -----------------------------------------------------------
x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: prod
  # Bí mật cho /internal/**. Trống thì ProductionHardening CHẶN khởi động — không phải cảnh báo.
  NEXATICKET_INTERNAL_SHAREDSECRET: ${INTERNAL_SHARED_SECRET:?can INTERNAL_SHARED_SECRET}
  OIDC_ISSUER: ${OIDC_ISSUER:?can OIDC_ISSUER, vi du https://auth.example.com/realms/nexaticket}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:?can RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?can RABBITMQ_PASSWORD}
  REDIS_HOST: redis
  # Địa chỉ identity-service cho TenantFilter của starter-security — thuộc tính
  # `nexaticket.identity.base-url`, mặc định dev `http://localhost:8090`. IDENTITY_URL ở dưới KHÔNG
  # tới được nó: chỉ catalog-service khai `base-url: ${IDENTITY_URL:...}` trong application.yml,
  # mười service kia không khai, nên trong container chúng gọi localhost:8090 — một địa chỉ không có
  # gì — và HttpMembershipLookup nuốt lỗi I/O thành "ẩn danh". Triệu chứng: cùng một token, đọc sơ đồ
  # ghế thì 200 (không cần danh tính), giữ ghế thì 401 "Authentication required"; catalog công khai
  # xanh nên smoke test không bắt được. Tên biến theo relaxed binding của Spring Boot, cùng cách với
  # NEXATICKET_INTERNAL_SHAREDSECRET ở trên; application.yml của từng service cũng được sửa để lần
  # build sau không còn phụ thuộc tên biến này.
  NEXATICKET_IDENTITY_BASEURL: http://identity-service:8080
  # Redis prod chạy với `--requirepass`, nhưng application.yml của api-gateway và inventory-service chỉ
  # khai host/port — không có chỗ nào nhận mật khẩu. Hậu quả không phải "không kết nối được": kết nối
  # vẫn mở, và MỖI lệnh trả NOAUTH. Gateway log `Error calling rate limiter lua` rồi CHO QUA (rate
  # limiting tắt im lặng ở production); inventory thì hỏng ở cổng kiểm tồn kho Redis lúc giữ ghế.
  # Biến này là relaxed binding của Spring Boot cho `spring.data.redis.password`, nên có hiệu lực
  # mà không cần build lại ảnh; application.yml cũng được sửa để lần build sau không còn phụ thuộc
  # vào tên biến này. Service không dùng Redis thì bỏ qua biến, vô hại.
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?can REDIS_PASSWORD}
  # ĐỦ MƯỜI địa chỉ, cho mọi service, dù service đó có gọi hay không. Bản trước chỉ cấp bốn
  # (identity, catalog, inventory, analytics) — đủ cho catalog, là service duy nhất smoke test đi
  # qua. ordering thiếu PAYMENT_URL nên gọi payment ở localhost:8095 — `Connection refused`, và
  # PlaceOrderHandler dịch nó thành 503 "Payment unavailable, please retry" cho khách, đúng ở bước
  # thanh toán. Mỗi service có một mặc định dev riêng cho từng URL, nên một biến thiếu không hỏng
  # lúc khởi động, không hỏng ở healthcheck, chỉ hỏng ở đúng lời gọi đầu tiên cần nó. Cấp dư rẻ
  # hơn nhiều so với cấp thiếu.
  IDENTITY_URL: http://identity-service:8080
  CATALOG_URL: http://catalog-service:8080
  INVENTORY_URL: http://inventory-service:8080
  ORDERING_URL: http://ordering-service:8080
  PAYMENT_URL: http://payment-service:8080
  LEDGER_URL: http://ledger-service:8080
  PAYOUT_URL: http://payout-service:8080
  TICKETING_URL: http://ticketing-service:8080
  NOTIFICATION_URL: http://notification-service:8080
  ANALYTICS_URL: http://analytics-service:8080
  AICHATBOX_URL: http://ai-chatbox-service:8080
  # Dữ liệu mẫu TẮT ở mọi service. ProductionHardening cũng chặn, nhưng khai ở đây để người đọc
  # compose không phải đi tra mặc định trong application.yml là gì.
  CATALOG_DEMO_DATA: "false"
  IDENTITY_DEMO_DATA: "false"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Trace TẮT mặc định. Bật khi đã có collector nghe ở OTEL_ENDPOINT — không có ai nhận thì
  # exporter lấp đầy log bằng lỗi kết nối. `--profile tracing` dựng sẵn một collector cục bộ.
  TRACING_ENABLED: ${TRACING_ENABLED:-false}
  OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318/v1/traces}
  OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-0.1}

x-service-base: &service-base
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
  # Đi cùng `-XX:MaxRAMPercentage=75` trong ảnh: JVM đọc đúng giới hạn này thay vì bộ nhớ của cả
  # máy chủ. Thiếu giới hạn ở đây thì tham số kia vô nghĩa.
  mem_limit: ${SERVICE_MEMORY:-768m}
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  identity-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/identity-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: identity-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USER: identity
      DB_PASSWORD: ${DB_PASSWORD_IDENTITY:?can DB_PASSWORD_IDENTITY}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:?can SUPER_ADMIN_EMAILS - khong co thi khong ai tao duoc to chuc dau tien}
      OIDC_BASE_URL: ${OIDC_BASE_URL:?can OIDC_BASE_URL}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KC_SECRET_IDENTITY_ADMIN:?can KC_SECRET_IDENTITY_ADMIN}
      PASSWORD_RESET_REDIRECT_URI: ${WEB_ADMIN_URL:?}/login

  catalog-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/catalog-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: catalog-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USER: catalog
      DB_PASSWORD: ${DB_PASSWORD_CATALOG:?can DB_PASSWORD_CATALOG}
      # Hai địa chỉ KHÁC NHAU, và đó là điểm dễ sai nhất của khối này:
      #   - MEDIA_ENDPOINT   : catalog gọi qua mạng nội bộ của compose.
      #   - MEDIA_PUBLIC_URL : trình duyệt gọi, nên phải là tên miền thật có https.
      # Chữ ký của URL tải lên bao gồm cả tên host. Khai nhầm MEDIA_PUBLIC_URL thành `objectstore:9000`
      # thì trình duyệt nhận một URL vừa không phân giải được vừa sai chữ ký.
      MEDIA_ENDPOINT: http://objectstore:9000
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:?can MEDIA_PUBLIC_URL}
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:?can MEDIA_ACCESS_KEY}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:?can MEDIA_SECRET_KEY}
      # TẮT ở production: ảnh dán từ host lạ làm mọi khách xem trang lộ IP cho host đó, và ảnh
      # biến mất vào ngày chủ host dọn dẹp mà không ai báo.
      MEDIA_ALLOW_EXTERNAL_URLS: "false"

  inventory-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/inventory-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: inventory-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USER: inventory
      DB_PASSWORD: ${DB_PASSWORD_INVENTORY:?can DB_PASSWORD_INVENTORY}
      INVENTORY_DEMO_OCCUPANCY: "0"

  ordering-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/ordering-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: ordering-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/ordering_db
      DB_USER: ordering
      DB_PASSWORD: ${DB_PASSWORD_ORDERING:?can DB_PASSWORD_ORDERING}

  payment-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/payment-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: payment-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USER: payment
      DB_PASSWORD: ${DB_PASSWORD_PAYMENT:?can DB_PASSWORD_PAYMENT}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:?can PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY:?can PAYOS_API_KEY}
      # Khoa nay ky va kiem chu ky webhook. Sai khoa = moi khoan tien phai xac nhan tay.
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:?can PAYOS_CHECKSUM_KEY}
      # Đường dẫn ĐẦY ĐỦ tới PayosWebhookController: `/api/billing/bank/webhook` là @RequestMapping
      # của lớp, `/payos` là @PostMapping của phương thức. Bản trước thiếu `/payos`: payOS gọi thử
      # lúc đăng ký nhận 404 "No handler for this path" và báo "webhook không hoạt động" — trong khi
      # endpoint thật vẫn sống, chỉ ở một đường dẫn dài hơn 6 ký tự. Khớp docs/03-seat-checkout/api/payos-webhook.md.
      PAYOS_WEBHOOK_URL: ${PUBLIC_API_BASE_URL:?}/api/billing/bank/webhook/payos
      # Trang khách mà payOS đưa người mua về sau khi trả/huỷ. Mặc định dev là localhost:3000 —
      # ở production là một tab trình duyệt trắng ngay sau khi tiền đã đi.
      WEB_BASE_URL: ${WEB_CUSTOMER_URL:?can WEB_CUSTOMER_URL}
      PAYMENT_SANDBOX: "false"

  ledger-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/ledger-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: ledger-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      # HAI role, không phải một (ADR-1005, bất biến 2). Owner bỏ qua mọi REVOKE trên bảng của
      # chính mình, nên service PHẢI chạy bằng role runtime không sở hữu schema — nếu không, sổ cái
      # mất tính append-only mà không có dấu hiệu nào.
      DB_USER: ledger_app
      DB_PASSWORD: ${DB_PASSWORD_LEDGER_APP:?can DB_PASSWORD_LEDGER_APP}
      DB_MIGRATION_USER: ledger_owner
      DB_MIGRATION_PASSWORD: ${DB_PASSWORD_LEDGER_OWNER:?can DB_PASSWORD_LEDGER_OWNER}

  payout-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/payout-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: payout-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/payout_db
      DB_USER: payout
      DB_PASSWORD: ${DB_PASSWORD_PAYOUT:?can DB_PASSWORD_PAYOUT}

  ticketing-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/ticketing-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: ticketing-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/ticketing_db
      DB_USER: ticketing
      DB_PASSWORD: ${DB_PASSWORD_TICKETING:?can DB_PASSWORD_TICKETING}

  notification-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/notification-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: notification-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USER: notification
      DB_PASSWORD: ${DB_PASSWORD_NOTIFICATION:?can DB_PASSWORD_NOTIFICATION}
      SMTP_HOST: ${SMTP_HOST:?can SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM: ${SMTP_FROM:?can SMTP_FROM}
      WEB_BASE_URL: ${WEB_CUSTOMER_URL:?}

  analytics-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/analytics-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: analytics-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      DB_USER: analytics
      DB_PASSWORD: ${DB_PASSWORD_ANALYTICS:?can DB_PASSWORD_ANALYTICS}

  # Trợ lý hỗ trợ khách hàng. Service DUY NHẤT tiêu tiền theo lượt request.
  #
  # `AI_PROVIDER` mặc định `local` (Ollama trong chính stack này) chứ không phải `anthropic`, và đó
  # là mặc định có chủ đích: chat hỗ trợ chạy suốt ngày, mỗi lượt tính tiền hai lần (nhúng + mô
  # hình) nhân với số vòng ReAct. Đổi sang `anthropic` thì khai thêm ANTHROPIC_API_KEY VÀ
  # VOYAGE_API_KEY — service từ chối khởi động nếu thiếu một trong hai, vì Claude không có endpoint
  # nhúng và một trợ lý mất RAG vẫn trả lời như thường, chỉ tệ hơn.
  ai-chatbox-service:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/ai-chatbox-service:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: ai-chatbox-service}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/ai_chatbox_db
      DB_USER: ai_chatbox
      DB_PASSWORD: ${DB_PASSWORD_AI_CHATBOX:?can DB_PASSWORD_AI_CHATBOX}
      # Tool tra đơn hàng đi bằng access token của CHÍNH KHÁCH qua đường công khai của ordering,
      # không qua /internal/** — xem OrderingHttpAdapter.
      ORDERING_URL: http://ordering-service:8080
      AI_PROVIDER: ${AI_PROVIDER:-local}
      # TÁCH khỏi AI_PROVIDER. Mặc định đi theo nó, nên không khai thì hành vi không đổi.
      # Có khoá Anthropic nhưng KHÔNG có khoá Voyage: đặt AI_PROVIDER=anthropic và
      # EMBEDDING_PROVIDER=local — Claude trả lời, bge-m3 lo phần nhúng. Cần bật profile ai-local
      # để container ollama chạy, nhưng chỉ nạp mô hình nhúng (~1,2 GB) chứ không nạp mô hình 7B.
      # EMBEDDING_PROVIDER=none thì tắt hẳn RAG: trợ lý vẫn tra được đơn, mất tri thức nền.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # Trần đồng thời của lượt chat, tách hẳn khỏi số luồng của Tomcat. Khai tường minh ở đây vì
      # con số đúng phụ thuộc nhà cung cấp: với Ollama một container thì vài chục là đã quá năng
      # lực suy luận thật; với Anthropic thì nới rộng được nhiều.
      AGENT_MAX_CONCURRENT_TURNS: ${AGENT_MAX_CONCURRENT_TURNS:-16}
      AGENT_MAX_QUEUED_TURNS: ${AGENT_MAX_QUEUED_TURNS:-32}
      AGENT_MAX_TURNS_PER_USER: ${AGENT_MAX_TURNS_PER_USER:-2}
    # Mô hình local nạp vào RAM và giữ ở đó; 768m của service-base không liên quan tới Ollama
    # (nó là container riêng), nhưng một lượt chat giữ cả bản ghi hội thoại nên nới nhẹ.
    mem_limit: ${AICHATBOX_MEMORY:-1g}

  # Mô hình chạy tại chỗ. Chỉ ai-chatbox-service gọi tới.
  #
  # KHÔNG publish cổng ra host: đây là một endpoint sinh văn bản không có xác thực nào, và mở nó ra
  # internet là tặng không năng lực tính toán của máy chủ cho bất kỳ ai tìm thấy cổng 11434.
  #
  # PHẢI pull mô hình sau lần dựng đầu — ảnh Ollama không mang mô hình nào theo:
  #   docker compose -f deploy/compose/prod.yml exec ollama ollama pull qwen2.5:7b-instruct
  #   docker compose -f deploy/compose/prod.yml exec ollama ollama pull bge-m3
  # Chưa pull thì mọi lượt chat trả 503 "trợ lý đang bận" — đúng hướng hỏng, nhưng không tự khỏi.
  #
  # Chạy trên CPU thì một lượt 30–60 giây là bình thường; hạn của service đã khai 120s cho đúng
  # thực tế đó. Có GPU thì thêm khối `deploy.resources.reservations.devices` cho ảnh này.
  ollama:
    profiles: ["ai-local"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    # 7B ở 4-bit chiếm ~5GB khi nạp, cộng chỗ cho bge-m3. Đặt thấp hơn thì container bị OOMKill
    # giữa một lượt trả lời, và log của service chỉ nói "không gọi được Ollama".
    mem_limit: ${OLLAMA_MEMORY:-8g}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Realtime không có database: nó chỉ đẩy sự kiện từ RabbitMQ xuống WebSocket.
  realtime-gateway:
    <<: *service-base
    image: ${REGISTRY:-nexaticket}/realtime-gateway:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: realtime-gateway}
    environment:
      <<: *service-env
      # WebSocket KHÔNG đi qua CORS như fetch: trình duyệt vẫn gửi `Origin`, nhưng không có
      # preflight nào để chặn. Nên danh sách này là chốt chặn duy nhất, và mặc định của nó là
      # localhost — để nguyên ở production nghĩa là mọi trang web đều mở được socket tới đây.
      NEXATICKET_REALTIME_ALLOWEDORIGINS: ${WEB_CUSTOMER_URL:?},${WEB_ADMIN_URL:?},${WEB_SCANNER_URL:?}
    depends_on:
      rabbitmq: {condition: service_healthy}

  # Cửa DUY NHẤT từ internet vào backend.
  api-gateway:
    restart: unless-stopped
    image: ${REGISTRY:-nexaticket}/api-gateway:${BACKEND_TAG:-latest}
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args: {SERVICE: api-gateway}
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    mem_limit: ${SERVICE_MEMORY:-768m}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NEXATICKET_INTERNAL_SHAREDSECRET: ${INTERNAL_SHARED_SECRET:?}
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      REDIS_HOST: redis
      # Khối env này KHÔNG dùng anchor x-service-env, nên mật khẩu Redis phải cấp riêng — thiếu nó
      # thì rate limiter log `Error calling rate limiter lua` 40 lần mỗi phút rồi cho qua.
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?can REDIS_PASSWORD}
      # Liệt kê tường minh bốn origin. `*` cộng với `allowCredentials` bị trình duyệt từ chối
      # thẳng, nên "mở hết cho xong" ở đây còn hỏng nhanh hơn là nguy hiểm — nhưng vẫn không làm.
      NEXATICKET_GATEWAY_ALLOWEDORIGINS: ${WEB_CUSTOMER_URL:?},${WEB_ADMIN_URL:?},${WEB_SCANNER_URL:?},${WEB_PLATFORM_URL:?}
      # Số proxy tin cậy đứng TRƯỚC gateway (ingress, CDN…). Sai số này thì rate limit hoặc vô
      # hiệu (kẻ tấn công tự khai X-Forwarded-For), hoặc dồn cả internet vào chung một hạn mức
      # (mọi IP nhìn ra như IP của proxy). Xem RateLimitConfig.
      NEXATICKET_GATEWAY_TRUSTEDPROXYCOUNT: ${TRUSTED_PROXY_COUNT:-1}
      IDENTITY_URL: http://identity-service:8080
      CATALOG_URL: http://catalog-service:8080
      INVENTORY_URL: http://inventory-service:8080
      ORDERING_URL: http://ordering-service:8080
      TICKETING_URL: http://ticketing-service:8080
      ANALYTICS_URL: http://analytics-service:8080
      LEDGER_URL: http://ledger-service:8080
      PAYMENT_URL: http://payment-service:8080
      # Thiếu dòng này thì route /v1/chat/** và /v1/support/** giữ mặc định `localhost:8101` — tức
      # là trỏ vào chính container gateway, và cả khung chat của khách lẫn bàn hỗ trợ nhận 503 trong
      # khi ai-chatbox-service chạy hoàn toàn tốt ở ngay mạng bên cạnh.
      AICHATBOX_URL: http://ai-chatbox-service:8080
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-0.1}
    depends_on:
      redis: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # --- Bốn app Next.js ---------------------------------------------------
  #
  # `REDIS_URL` KHÔNG phải tuỳ chọn. Phiên đăng nhập nằm ở store phía server, và bản in-memory chỉ
  # sống trong một tiến trình: nhiều instance không thấy phiên của nhau, còn Next thì tái tạo tiến
  # trình bất cứ lúc nào. Thiếu biến này thì app TỪ CHỐI khởi động thay vì âm thầm đăng xuất người
  # dùng ngẫu nhiên — xem `defaultRefreshTokenStore`.
  #
  # `AUTH_SECRET` mỗi app một giá trị: dùng chung thì cookie phiên của app này giải mã được ở app
  # kia, và ranh giới giữa app khách với app quản trị chỉ còn là quy ước.
  web-customer:
    restart: unless-stopped
    image: ${REGISTRY:-nexaticket}/web-customer:${FRONTEND_TAG:-latest}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP: web-customer
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?can PUBLIC_API_BASE_URL}
    # Bind vào 127.0.0.1, KHÔNG phải 0.0.0.0.
    #
    # Nginx chạy trên host nên vẫn tới được; internet thì không, kể cả khi Security Group bị khai
    # sai. Trước đây lớp bảo vệ duy nhất là SG — gõ lệch một rule là bốn app và Keycloak phơi
    # thẳng ra ngoài, không qua TLS.
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: ${APP_MEMORY:-512m}
    environment:
      AUTH_URL: ${WEB_CUSTOMER_URL:?}
      AUTH_SECRET: ${AUTH_SECRET_WEB_CUSTOMER:?moi app mot secret rieng}
      KEYCLOAK_ISSUER: ${OIDC_ISSUER:?}
      KEYCLOAK_CLIENT_ID: web-customer
      KEYCLOAK_CLIENT_SECRET: ${KC_SECRET_WEB_CUSTOMER:?can secret client web-customer}
      # HAI địa chỉ API, cùng một lý do với MEDIA_ENDPOINT / MEDIA_PUBLIC_URL ở catalog-service:
      #   - NEXT_PUBLIC_API_BASE_URL : nhúng vào bundle lúc build, TRÌNH DUYỆT gọi -> tên miền thật.
      #   - API_BASE_URL             : server-api.ts đọc lúc chạy, TIẾN TRÌNH NODE trong container gọi
      #                                khi render phía server -> đi thẳng tới gateway qua mạng compose.
      # Thiếu dòng này thì SSR rơi về NEXT_PUBLIC_API_BASE_URL: mỗi lần render trang chủ, container
      # đi ra internet, tới Elastic IP của chính máy này, qua Nginx, rồi mới vào gateway cách nó một
      # bridge. Chậm hơn, phụ thuộc hairpin NAT của AWS, và khi đường đó hỏng thì trang khách trống
      # trơn trong khi smoke test — chạy từ host — vẫn xanh.
      API_BASE_URL: http://api-gateway:8080
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
    depends_on:
      redis: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  web-admin:
    restart: unless-stopped
    image: ${REGISTRY:-nexaticket}/web-admin:${FRONTEND_TAG:-latest}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP: web-admin
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?can PUBLIC_API_BASE_URL}
    ports: ["127.0.0.1:3001:3000"]
    mem_limit: ${APP_MEMORY:-512m}
    environment:
      AUTH_URL: ${WEB_ADMIN_URL:?}
      AUTH_SECRET: ${AUTH_SECRET_WEB_ADMIN:?moi app mot secret rieng}
      KEYCLOAK_ISSUER: ${OIDC_ISSUER:?}
      KEYCLOAK_CLIENT_ID: web-admin
      KEYCLOAK_CLIENT_SECRET: ${KC_SECRET_WEB_ADMIN:?can secret client web-admin}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
    depends_on:
      redis: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  web-scanner:
    restart: unless-stopped
    image: ${REGISTRY:-nexaticket}/web-scanner:${FRONTEND_TAG:-latest}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP: web-scanner
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?can PUBLIC_API_BASE_URL}
    ports: ["127.0.0.1:3002:3000"]
    mem_limit: ${APP_MEMORY:-512m}
    environment:
      AUTH_URL: ${WEB_SCANNER_URL:?}
      AUTH_SECRET: ${AUTH_SECRET_WEB_SCANNER:?moi app mot secret rieng}
      KEYCLOAK_ISSUER: ${OIDC_ISSUER:?}
      KEYCLOAK_CLIENT_ID: web-scanner
      KEYCLOAK_CLIENT_SECRET: ${KC_SECRET_WEB_SCANNER:?can secret client web-scanner}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
    depends_on:
      redis: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  web-platform:
    restart: unless-stopped
    image: ${REGISTRY:-nexaticket}/web-platform:${FRONTEND_TAG:-latest}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        APP: web-platform
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?can PUBLIC_API_BASE_URL}
    ports: ["127.0.0.1:3003:3000"]
    mem_limit: ${APP_MEMORY:-512m}
    environment:
      AUTH_URL: ${WEB_PLATFORM_URL:?}
      AUTH_SECRET: ${AUTH_SECRET_WEB_PLATFORM:?moi app mot secret rieng}
      KEYCLOAK_ISSUER: ${OIDC_ISSUER:?}
      KEYCLOAK_CLIENT_ID: web-platform
      KEYCLOAK_CLIENT_SECRET: ${KC_SECRET_WEB_PLATFORM:?can secret client web-platform}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
    depends_on:
      redis: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # --- Hạ tầng ---------------------------------------------------------------
  postgres:
    # pgvector: ai-chatbox-service cần extension `vector`, không có trong ảnh chính thức.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # 200 = 11 service x 10 kết nối, cộng chỗ trống cho psql và công cụ sao lưu. Mặc định 100
    # KHÔNG đủ: service khởi động sau chết với "remaining connection slots are reserved", một
    # thông báo không hề gợi ý rằng nguyên nhân nằm ở cấu hình pool của service khác.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?can POSTGRES_SUPERUSER_PASSWORD}
      # Mật khẩu của từng user service, đọc bởi initdb-prod/01-databases.sh.
      DB_PASSWORD_IDENTITY: ${DB_PASSWORD_IDENTITY:?}
      DB_PASSWORD_CATALOG: ${DB_PASSWORD_CATALOG:?}
      DB_PASSWORD_INVENTORY: ${DB_PASSWORD_INVENTORY:?}
      DB_PASSWORD_ORDERING: ${DB_PASSWORD_ORDERING:?}
      DB_PASSWORD_PAYMENT: ${DB_PASSWORD_PAYMENT:?}
      DB_PASSWORD_LEDGER_OWNER: ${DB_PASSWORD_LEDGER_OWNER:?}
      DB_PASSWORD_LEDGER_APP: ${DB_PASSWORD_LEDGER_APP:?}
      DB_PASSWORD_PAYOUT: ${DB_PASSWORD_PAYOUT:?}
      DB_PASSWORD_TICKETING: ${DB_PASSWORD_TICKETING:?}
      DB_PASSWORD_NOTIFICATION: ${DB_PASSWORD_NOTIFICATION:?}
      DB_PASSWORD_ANALYTICS: ${DB_PASSWORD_ANALYTICS:?}
      # Thiếu biến này thì initdb-prod/01-databases.sh dừng ngay ở dòng `need` với "THIEU bien moi
      # truong DB_PASSWORD_AI_CHATBOX" — và vì nó chạy trong entrypoint của Postgres, cái chết đó
      # kéo theo CẢ stack, không riêng ai-chatbox.
      DB_PASSWORD_AI_CHATBOX: ${DB_PASSWORD_AI_CHATBOX:?}
      DB_PASSWORD_KEYCLOAK: ${DB_PASSWORD_KEYCLOAK:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bản prod, KHÔNG phải `./initdb`: bản kia đặt mật khẩu bằng chính tên service.
      - ./initdb-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `appendonly yes` — KHÁC bản dev, và đây là điểm quan trọng nhất của service này.
    #
    # Phiên đăng nhập của cả bốn app nằm trong Redis. Bản dev chạy `--appendonly no --save ""`
    # (thuần bộ nhớ) vì mất phiên lúc phát triển chẳng sao. Giữ nguyên cấu hình đó ở production
    # nghĩa là MỌI người dùng bị đăng xuất cùng lúc sau một lần khởi động lại Redis — kể cả lần
    # khởi động lại theo lịch để vá bảo mật.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?can REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    # Image tự dựng để bật plugin delayed message — cần cho retry backoff (ADR-1009).
    #
    # `image:` PHẢI khai tường minh, DÙ ảnh này không bao giờ được kéo từ registry.
    #
    # Một service chỉ có `build:` được compose đặt tên ảnh theo TÊN PROJECT: `name: nexaticket-prod`
    # ở đầu file, cộng tên service, thành `nexaticket-prod-rabbitmq:latest`. Cái tên đó không xuất
    # hiện ở bất kỳ đâu trong repo, nên khi `up --no-build` không tìm thấy nó, thông điệp
    #
    #     Error response from daemon: No such image: nexaticket-prod-rabbitmq:latest
    #
    # không chỉ về dòng `build:` này — người đọc đi tìm một image tên như vậy trên GHCR.
    #
    # Và vì MỘT ảnh thiếu làm CẢ `compose up` chết, triệu chứng không phải "thiếu RabbitMQ" mà là
    # KHÔNG container nào được tạo: 21 ảnh kia đã kéo xong vẫn vô ích, `docker ps` trống trơn, mọi
    # tên miền trả 502. Thứ chặn cả hệ là ảnh nhỏ nhất.
    #
    # Tên tường minh ở đây nói thẳng hai điều: ảnh dựng TẠI CHỖ trên máy chủ (ExecStartPre của
    # nexaticket.service), và nó KHÔNG thuộc registry — nên `compose pull` phải bỏ qua nó bằng
    # `--ignore-buildable`.
    #
    # KHÔNG dùng ${BACKEND_TAG}: tag đó đổi theo từng commit backend, và nó sẽ recreate broker ở
    # mỗi lần deploy dù Dockerfile của RabbitMQ không đổi một dòng — mất kết nối của mọi consumer
    # để đổi sang một ảnh giống y hệt.
    image: nexaticket/rabbitmq-delayed:${RABBITMQ_TAG:-local}
    build: {context: ../rabbitmq}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # `start`, KHÔNG phải `start-dev`.
    #
    # `start-dev` giữ database trong chính filesystem của container: recreate container là mất
    # sạch tài khoản. Hậu quả không nhìn ra được từ phía Keycloak — identity_db nhận diện người
    # dùng theo `idp_subject`, nên sau một lần recreate mọi tài khoản cũ đều lệch, đăng nhập vẫn
    # qua nhưng MỌI lời gọi API trả 401/403 trong khi giao diện hiển thị là đã đăng nhập.
    command: ["start", "--import-realm"]
    # Keycloak PHẢI với tới được từ trình duyệt: vòng đăng nhập là một chuỗi chuyển hướng của
    # chính trình duyệt, không phải lời gọi server-to-server. Ingress đầu vào TLS trỏ
    # `KEYCLOAK_HOSTNAME` về cổng này.
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${DB_PASSWORD_KEYCLOAK:?}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?can KEYCLOAK_HOSTNAME, vi du https://auth.example.com}
      # TLS kết thúc ở ingress phía trước. Thiếu `KC_PROXY_HEADERS` thì Keycloak dựng redirect URI
      # bằng http:// nội bộ, và vòng đăng nhập gãy ở bước quay về với lỗi không nói rõ lý do.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Từ Keycloak 25, /health/* nằm ở cổng 9000 và mặc định TẮT. Thiếu biến này thì healthcheck
      # không bao giờ xanh và `up --wait` treo tới hết giờ, dù Keycloak phục vụ bình thường.
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      # Realm production đọc từng biến dưới đây. Không cái nào có mặc định — secret của client
      # nằm trong repo là secret đã lộ.
      KC_SECRET_WEB_CUSTOMER: ${KC_SECRET_WEB_CUSTOMER:?}
      KC_SECRET_WEB_ADMIN: ${KC_SECRET_WEB_ADMIN:?}
      KC_SECRET_WEB_SCANNER: ${KC_SECRET_WEB_SCANNER:?}
      KC_SECRET_WEB_PLATFORM: ${KC_SECRET_WEB_PLATFORM:?}
      KC_SECRET_IDENTITY_ADMIN: ${KC_SECRET_IDENTITY_ADMIN:?}
      WEB_CUSTOMER_URL: ${WEB_CUSTOMER_URL:?}
      WEB_ADMIN_URL: ${WEB_ADMIN_URL:?}
      WEB_SCANNER_URL: ${WEB_SCANNER_URL:?}
      WEB_PLATFORM_URL: ${WEB_PLATFORM_URL:?}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
    volumes:
      # CHỈ bản .prod.json. Bản dev có bốn tài khoản mật khẩu bằng tên đăng nhập và
      # `registrationAllowed: true` cho mọi client.
      - ../keycloak/nexaticket-realm.prod.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1

Host: x

Connection: close



' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Bộ thu trace. Chỉ chạy khi bật hồ sơ: `docker compose --profile tracing up -d`.
  #
  # Cấu hình mặc định của ảnh này nhận OTLP ở 4317 (gRPC) và 4318 (HTTP) rồi ghi ra log của chính
  # nó. Đủ để xem trace có tới nơi không; đưa vào Tempo/Jaeger thì thêm exporter trong file cấu
  # hình riêng. Cố ý KHÔNG dựng sẵn kho lưu trữ: chọn kho là quyết định vận hành, và một Tempo
  # không ai cấu hình lưu giữ sẽ âm thầm đầy đĩa.
  otel-collector:
    profiles: ["tracing"]
    image: otel/opentelemetry-collector-contrib:0.115.1
    restart: unless-stopped
    mem_limit: 256m

  # ---------------------------------------------------------------------------
  # Kho ảnh (S3).
  #
  # Đây từng là MinIO. MinIO đã gỡ ảnh container cộng đồng khỏi mọi registry công khai —
  # `minio/minio` và `minio/mc` không còn kéo được nữa, kể cả bằng tag phiên bản cũ. Hậu quả là
  # file này có một giai đoạn KHÔNG AI khởi động được, và lỗi hiện ra là "pull access denied",
  # một câu không hề gợi ý rằng nguyên nhân nằm ở chuyện cấp phép của nhà cung cấp.
  #
  # SeaweedFS thay vào chỗ đó: vẫn là S3 thật, Apache-2.0, một container. Đã kiểm đúng sáu luồng
  # mà ứng dụng dùng — URL ký sẵn PUT được, chữ ký sai bị chặn, HEAD trả đúng content-type và kích
  # thước (PosterUrlPolicy dựa vào cả hai), GET ẩn danh đọc được, CORS preflight đúng, và xoá thật
  # sự xoá. Không phải bản giả lập cho test.
  #
  # Bài học đã ghim vào file: **không dùng tag `latest` cho hạ tầng**. Tag nổi làm bản dựng hôm
  # nay khác bản dựng hôm qua mà không ai đổi một dòng nào, và khi nó hỏng thì hỏng cho tất cả
  # cùng lúc.
  # ---------------------------------------------------------------------------
  #
  # Trình duyệt tải lên THẲNG đây bằng URL đã ký, và khách xem trang tải ảnh về từ đây — nên nó
  # phải nằm sau reverse proxy có TLS, ở đúng tên miền khai trong MEDIA_PUBLIC_URL.
  #
  # Cổng 9000 KHÔNG mở ra host: proxy nói chuyện với nó qua mạng nội bộ của compose. Mở thẳng ra
  # ngoài là phơi một endpoint S3 không TLS.
  #
  # Muốn dùng dịch vụ có sẵn (S3, Cloudflare R2) thay vì tự vận hành: xoá service này và trỏ
  # MEDIA_ENDPOINT + MEDIA_PUBLIC_URL sang đó. Adapter đã là AWS SDK v2 nên không phải sửa code.
  # ---------------------------------------------------------------------------
  objectstore:
    # Publish ra loopback để Nginx proxy `media.<domain>` vào đây.
    #
    # Trước đây container này không publish cổng nào, nên MEDIA_PUBLIC_URL trỏ vào một địa chỉ
    # trình duyệt không với tới được: upload ảnh bìa sinh presigned URL rồi hỏng ở bước tải lên.
    # KHÔNG bind 0.0.0.0 — đây là một endpoint S3 không có TLS, Nginx mới là chỗ kết thúc TLS.
    ports: ["127.0.0.1:9000:9000"]
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    environment:
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:?can MEDIA_ACCESS_KEY}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:?can MEDIA_SECRET_KEY}
      # Chỉ tên miền của khu quản trị: đây là danh sách những nơi được phép GỬI ảnh lên.
      # `*` ở đây nghĩa là bất kỳ trang nào trên internet cũng dùng được URL ký sẵn mà nó lấy được.
      MEDIA_CORS_ORIGIN: ${MEDIA_CORS_ORIGIN:?can MEDIA_CORS_ORIGIN}
    # `-s3.config` chỉ đọc được file tĩnh, nên file được sinh tại chỗ từ biến môi trường. Nếu đặt
    # sẵn trong repo thì đó là khoá production nằm trong lịch sử git.
    #
    # Danh tính `anonymous` với quyền `Read` là thứ thay cho `mc anonymous set download` của MinIO:
    # khách xem trang không có khoá, nên ảnh bìa phải đọc được mà không cần ký.
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[
          {"name":"anonymous","actions":["Read"]},
          {"name":"app","credentials":[{"accessKey":"$${MEDIA_ACCESS_KEY}","secretKey":"$${MEDIA_SECRET_KEY}"}],
           "actions":["Admin","Read","Write","List","Tagging"]}
        ]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json \
          -s3.allowedOrigins="$${MEDIA_CORS_ORIGIN}" -s3.autoCreateBucket
    volumes:
      - mediadata:/data
    healthcheck:
      # `/` trả 403 vì danh tính ẩn danh không được liệt kê bucket — dùng nó làm healthcheck thì
      # container không bao giờ lành. `/status` là endpoint trả 200 khi cổng S3 đã phục vụ được.
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:9000/status"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  mediadata:
  # Mo hinh da pull. Volume rieng vi mot mo hinh 7B la ~5GB: mat no nghia la moi lan dung lai
  # container phai tai lai tu dau, va luot chat dau tien sau do het thoi gian cho.
  ollamadata:
