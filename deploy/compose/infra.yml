# Hạ tầng dùng chung — luôn chạy khi phát triển.
#   docker compose -f deploy/compose/infra.yml up -d
name: nexaticket-infra

services:
  postgres:
    image: postgres:16-alpine
    # Mặc định của Postgres là 100 kết nối. Ở MVP, mười một service dùng chung cụm này (ADR-1002),
    # nên 100 không đủ cho cả hệ thống chạy cùng lúc — service khởi động sau chết với
    # "remaining connection slots are reserved for roles with the SUPERUSER attribute", một thông
    # báo không hề gợi ý rằng nguyên nhân nằm ở cấu hình pool của service khác.
    #
    # 200 = 11 service x 10 kết nối, cộng chỗ trống cho psql và công cụ. Đi kèm việc hạ pool mặc
    # định của service xuống 10; chỉ nâng một trong hai đầu là chưa đủ.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mỗi service một database + một user riêng (ADR-1002).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    # Image tự dựng để bật plugin delayed message — cần cho retry backoff (ADR-1009).
    build:
      context: ../rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nexaticket
      RABBITMQ_DEFAULT_PASS: nexaticket
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8081"
    ports: ["8081:8081"]
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30

  mailhog:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  rabbitdata:
